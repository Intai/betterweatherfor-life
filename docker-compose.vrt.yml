# Self-hosted Visual Regression Tracker for local visual regression runs.
# Upstream: https://github.com/Visual-Regression-Tracker/Visual-Regression-Tracker
#
# Values are literal on purpose. Docker Compose auto-loads ./.env and the Makefile
# exports it, so any ${VAR} here could silently inherit app settings. Named volumes
# replace upstream's ./db and ./imageUploads bind mounts, which would collide with
# this repo's db/ directory.
name: vrt

volumes:
  vrt_db_data:
  vrt_image_uploads:

services:
  vrt-db:
    image: postgres:12
    # The migration image's entrypoint hardcodes `wait-for-it.sh postgres:5432`,
    # so the host name `postgres` must resolve even though the service is renamed.
    networks:
      default:
        aliases:
          - postgres
    ports:
      - "127.0.0.1:5433:5432"   # 5432 is the app db; loopback only
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vrt_db
    volumes:
      - vrt_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d vrt_db -U postgres"]
      interval: 10s
      timeout: 120s
      retries: 10

  vrt-migration:
    image: visualregressiontracker/migration:5.3.0
    restart: on-failure
    depends_on:
      vrt-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@vrt-db:5432/vrt_db

  vrt-api:
    image: visualregressiontracker/api:5.5.0
    depends_on:
      vrt-db:
        condition: service_healthy
    ports:
      - "4200:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@vrt-db:5432/vrt_db
      JWT_SECRET: vrtLocalOnlySecret
      JWT_LIFE_TIME: 30d
      APP_FRONTEND_URL: http://localhost:8080
      BODY_PARSER_JSON_LIMIT: 10mb
    volumes:
      - vrt_image_uploads:/imageUploads

  vrt-ui:
    image: visualregressiontracker/ui:5.4.0
    depends_on:
      - vrt-api
    ports:
      - "8080:8080"
    environment:
      REACT_APP_API_URL: http://localhost:4200
      VRT_VERSION: 5.4.0
      PORT: 8080
    volumes:
      - vrt_image_uploads:/usr/share/nginx/html/static/imageUploads
