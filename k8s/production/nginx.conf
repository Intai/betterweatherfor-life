events {
    worker_connections 1024;
}

http {
    # Extract cookie values for cache key
    map $http_cookie $cookie_selected_activity {
        default "";
        "~selectedActivity=(?<val>[^;]+)" $val;
    }
    map $http_cookie $cookie_selected_day {
        default "";
        "~selectedDay=(?<val>[^;]+)" $val;
    }
    map $http_cookie $cookie_selected_date {
        default "";
        "~selectedDate=(?<val>[^;]+)" $val;
    }
    map $http_cookie $cookie_selected_time_range {
        default "";
        "~selectedTimeRange=(?<val>[^;]+)" $val;
    }

    # Extract first locale from Accept-Language header
    map $http_accept_language $first_locale {
        default "en";
        "~^(?<lang>[a-zA-Z-]+)" $lang;
    }

    # Proxy cache zone
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=nextjs_cache:10m max_size=100m inactive=60m;
    # Composite cache key
    proxy_cache_key "$scheme$request_method$host$request_uri|$cookie_selected_activity|$cookie_selected_day|$cookie_selected_date|$cookie_selected_time_range|$first_locale";

    upstream nextjs {
        server web:3000;
    }

    server {
        listen 80;
        server_name localhost;

        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
        gzip_min_length 1000;

        location / {
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Cache successful responses for one hour
            proxy_cache nextjs_cache;
            proxy_cache_valid 200 60m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock on;
            proxy_ignore_headers Cache-Control Set-Cookie;
            add_header X-Cache-Status $upstream_cache_status;
        }

        location /_next/static {
            proxy_pass http://nextjs;
            proxy_cache_valid 60m;
        }

        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }
    }
}
