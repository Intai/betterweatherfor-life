apiVersion: batch/v1
kind: CronJob
metadata:
  name: forecast
spec:
  schedule: "0 12 * * 4"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 7200
      backoffLimit: 0
      template:
        metadata:
          labels:
            app: forecast
        spec:
          securityContext:
            fsGroup: 1001
          restartPolicy: Never
          initContainers:
            - name: wait-for-db
              image: postgres:18-alpine
              command: ["sh", "-c", "until pg_isready -h db -U betterweather -d betterweather; do sleep 2; done"]
          containers:
            - name: forecast
              image: betterweather-forecast:latest
              envFrom:
                - configMapRef:
                    name: web-config
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: db-secret
                      key: DATABASE_URL
                - name: GOOGLE_WEATHER_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: web-secret
                      key: GOOGLE_WEATHER_API_KEY
              volumeMounts:
                - name: claude-data
                  mountPath: /home/pwuser/.claude
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 768Mi
          volumes:
            - name: claude-data
              persistentVolumeClaim:
                claimName: forecast-claude-pvc
