[project]
name = "langraph"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "claude-agent-sdk",
    "langchain-google-genai",
    "langchain-openai",
    "langchain-xai",
    "langgraph",
    "langsmith",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["langgraph-cli[inmem]", "pytest", "pytest-cov", "ruff"]

[tool.setuptools.packages.find]
exclude = ["tests*"]

[tool.ruff]
target-version = "py313"

[tool.coverage.run]
source = ["langraph/agents", "langraph/app", "langraph/models", "langraph/nodes", "langraph/prompts", "langraph/sources", "langraph/tools", "langraph/utils"]
omit = ["*/__init__.py"]
