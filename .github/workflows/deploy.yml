name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      app_changed: ${{ steps.filter.outputs.app_changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: filter
        run: |
          CHANGED=$(git diff --name-only ${{ github.event.before }} HEAD)
          APP_CHANGED=$(echo "$CHANGED" | grep -cvE '^(\.claude/|\.github/|\.husky/|k8s/|terraform/|\.env\.example|\.gitignore|[^/]*\.md)' || true)
          echo "app_changed=$( [ "$APP_CHANGED" -gt 0 ] && echo true || echo false )" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --silent

  build:
    needs: [detect-changes, test]
    if: needs.detect-changes.outputs.app_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: true
          tags: ghcr.io/intai/betterweather-web:latest
          build-args: |
            NODE_ENV=production
            NODE_CONFIG_ENV=production
            BUILD=${{ github.run_id }}
          secrets: |
            GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push forecast image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.forecast
          push: true
          tags: ghcr.io/intai/betterweather-forecast:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [detect-changes, test, build]
    if: always() && needs.test.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          install kubectl /usr/local/bin/kubectl
      - name: Set up kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -k k8s/production
          kubectl rollout status deployment db -n betterweather --timeout=240s
          kubectl rollout status deployment nginx -n betterweather --timeout=240s
          kubectl rollout status deployment web -n betterweather --timeout=240s
      - name: Restart web deployment
        if: needs.detect-changes.outputs.app_changed == 'true'
        run: |
          kubectl rollout restart deployment web -n betterweather
          kubectl rollout status deployment web -n betterweather --timeout=240s
